plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.willi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.willi.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0-powered"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API key stored in local.properties, injected at build time
        buildConfigField "String", "CLAUDE_API_KEY", "\"${project.findProperty('CLAUDE_API_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Room database (mémoire persistante)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // HTTP client pour Claude API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    // TensorFlow Lite (empreinte vocale)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.3.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Biométrie (empreinte digitale + visage)
    implementation 'androidx.biometric:biometric:1.1.0'

    // Chiffrement données (AES-256)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // SQLCipher — chiffrement base de données
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite-ktx:2.3.1'

    // Jsoup — parsing HTML pour apprentissage web
    implementation 'org.jsoup:jsoup:1.17.2'

    // WorkManager — tâches d'apprentissage en arrière-plan
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
