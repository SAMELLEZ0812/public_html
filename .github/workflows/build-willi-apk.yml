name: Build WILLI APK

on:
  push:
    branches: [ "claude/computer-access-question-wrg7kt", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create local.properties
        working-directory: willi-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> local.properties

      - name: Make gradlew executable
        working-directory: willi-android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: willi-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WILLI-APK
          path: willi-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: willi-v${{ github.run_number }}
          name: "WILLI v${{ github.run_number }}"
          files: willi-android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## WILLI — Intelligence Artificielle Personnelle
            Téléchargez l'APK et installez-le sur votre téléphone Android.
            Activez "Sources inconnues" dans les paramètres Android si nécessaire.
